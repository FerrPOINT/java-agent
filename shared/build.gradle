plugins {
    id 'java-library'
    id 'io.spring.dependency-management' version '1.1.7'
}
def privateProduction = providers.gradleProperty('baseProductionRole').isPresent()
if (privateProduction && (!gradle.ext.has('baseProductionScope') || gradle.ext.baseProductionScope.role != 'cli-main-v1')) {
    throw new GradleException('Private production requires its validated source settings')
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:4.1.0"
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spring.io/milestone' }
}

dependencies {
    // Jackson — DTO (de)serialization shared by all modules
    api 'com.fasterxml.jackson.core:jackson-databind'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Spring web (RestClient factory) — version from Spring Boot BOM
    api 'org.springframework:spring-web'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'
}

if (!privateProduction) {
    apply from: file('test-dependencies.gradle')
}

// Base test policy: automatic unit checks; explicit integration/slow release lanes.
apply from: file('../gradle/ferrpoint-notices.gradle').exists() ? file('../gradle/ferrpoint-notices.gradle') : file('gradle/ferrpoint-notices.gradle')
if (!privateProduction) {
    apply from: file("../gradle/test-lanes.gradle").exists() ? file("../gradle/test-lanes.gradle") : file("gradle/test-lanes.gradle")
}
apply from: file('../gradle/quality-inputs.gradle').exists() ? file('../gradle/quality-inputs.gradle') : file('gradle/quality-inputs.gradle')
