plugins {
    id 'java'
    id 'groovy'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.azhukov'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spring.io/milestone' }
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-health'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Groovy
    implementation 'org.apache.groovy:groovy:6.0.0'
    implementation 'org.apache.groovy:groovy-json:6.0.0'

    // DB / migrations
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'

    // Resilience
    implementation 'io.github.resilience4j:resilience4j-retry:2.4.0'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.4.0'

    // HTML / markdown parsing
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'com.vladsch.flexmark:flexmark:0.64.8'

    // Commons
    implementation 'org.apache.commons:commons-lang3:3.21.0'
    implementation 'commons-io:commons-io:2.18.0'

    // Logging
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'

    // Jackson JSR310 (java.time support)
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.48'
    annotationProcessor 'org.projectlombok:lombok:1.18.48'

    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // h10: shared DTOs/mapper/REST client factory instead of the phantom backend dependency
    implementation project(':shared')

    // spring-web's MultipartBodyBuilder references reactive-streams types in
    // method signatures; needed at runtime (was previously transitive via backend)
    implementation 'org.reactivestreams:reactive-streams'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.apache.groovy:groovy-test:6.0.0'
    runtimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'live', 'slow', 'e2e'
    }
    jvmArgs '-XX:+EnableDynamicAgentLoading'
    maxHeapSize = '2g'
}

tasks.named('jacocoTestReport') {
    dependsOn test, integrationTest, slowTest
    executionData(test, integrationTest, slowTest)
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs += [
        '-Amapstruct.defaultComponentModel=spring',
        '-Amapstruct.unmappedTargetPolicy=ERROR',
        '-Amapstruct.suppressGeneratorTimestamp=true'
    ]
}

apply from: file('../gradle/build-info.gradle').exists() ? file('../gradle/build-info.gradle') : file('gradle/build-info.gradle')

apply from: file('../gradle/ferrpoint-notices.gradle').exists() ? file('../gradle/ferrpoint-notices.gradle') : file('gradle/ferrpoint-notices.gradle')

// maxHeapSize prevents OOM/SIGKILL when real LLM calls buffer large payloads
// inside the Gradle daemon JVM. For production-like runs prefer `java -jar`.
tasks.named('bootRun') {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    maxHeapSize = '2g'
}

tasks.named('bootJar') {
    manifest {
        attributes 'Start-Class': 'com.azhukov.agent.bot.BotApplication'
    }
}

// Base test policy: automatic unit checks; explicit integration/slow release lanes.
apply from: file("../gradle/test-lanes.gradle").exists() ? file("../gradle/test-lanes.gradle") : file("gradle/test-lanes.gradle")
apply from: file('../gradle/quality-inputs.gradle').exists() ? file('../gradle/quality-inputs.gradle') : file('gradle/quality-inputs.gradle')
