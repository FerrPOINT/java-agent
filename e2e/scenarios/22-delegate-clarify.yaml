# Features: delegate_task + clarify — orchestration surface
name: delegate-clarify
steps:
  - name: agent delegates a simple computation
    step: turn
    message: "Use the delegate_task tool to spawn a subagent that counts from 1 to 5 and returns the sum. Wait for the result and tell me the number."
    timeout: 180
    assert:
      - { var: turn.toolNames, contains: delegate_task }
      - { var: turn.text, contains: "15" }
      - { var: turn.error, eq: null }

  - name: API server reports clarify as intentionally unavailable
    step: turn
    message: "Ask me ONE clarifying question about what I just said. Use the clarify tool if it is available; otherwise explain briefly why it is unavailable in this HTTP API session."
    assert:
      - { var: turn.toolNames, not_contains: clarify }
      - { var: turn.text, matches: "(?i)(clarify|уточн|интерактив|interactive|недоступ)" }
      - { var: turn.error, eq: null }