# Features: delegate_task + clarify — orchestration surface
name: delegate-clarify
steps:
  - name: delegation tool contract is registered
    # Tool selection is model behavior; verify the live registry deterministically.
    step: request
    path: /v1/toolsets
    assert:
      - { path: "data[*].tools", contains: delegate_task }
      - { status: 200 }

  - name: clarify tool contract is registered
    # This is a deterministic contract check. Tool invocation itself is model
    # choice, so testing it through an LLM prompt makes the suite flaky.
    step: request
    path: /v1/toolsets
    assert:
      - { path: "data[*].tools", contains: clarify }
      - { status: 200 }