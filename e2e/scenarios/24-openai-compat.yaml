# Features: OpenAI-compatible /v1/chat/completions + /v1/models — external API surface
name: openai-compat
steps:
  - name: models list
    method: GET
    path: /v1/models
    assert:
      - { path: object, eq: list }
      - { path: data, len_gte: 1 }

  - name: chat completion round-trip
    method: POST
    path: /v1/chat/completions
    body:
      model: main-dev
      messages:
        - { role: user, content: "Ответь ровно одним словом: ок" }
    assert:
      - { path: choices, len_gte: 1 }
      - { path: "choices[0].message.role", eq: assistant }
    extract:
      "choices[0].message.content": completion_text

  - name: completion answered (checked on the response of this same step)
    path: /v1/models
    assert:
      - { var: completion_text, matches: "(?i)ок|Ок|ОК" }

  - name: unknown bare model falls back to configured agent (Hermes parity)
    method: POST
    path: /v1/chat/completions
    body:
      model: no-such-model
      messages:
        - { role: user, content: "Скажи: готово" }
    assert:
      # Hermes _request_agent_overrides(allow_bare_model=direct_model_requests=false):
      # generic clients hardcode model names; unknown bare names fall back to the
      # gateway default instead of leaking to the provider (alias-leak bug).
      - { status: 200 }
