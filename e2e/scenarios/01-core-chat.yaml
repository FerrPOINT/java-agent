# Core chat loop: session create, streaming turn, history persistence
name: core-chat
steps:
  - name: health via /agent/health
    path: /agent/health
    assert: { status: 200 }

  - name: streaming turn answers
    step: turn
    message: "Ответь ровно одним словом: ок"
    assert:
      - { var: turn.text, matches: "(?i)ок" }
      - { var: turn.error, eq: null }

  - name: session persisted with messages
    path: /agent/session/{session_id}/history
    assert:
      - { path: "[0].role", eq: user }
      - { status: 200 }

  - name: history has the user message verbatim
    path: /agent/session/{session_id}/history
    assert:
      - { path: "[0].content", contains: "одним словом" }

  - name: second turn keeps the same session
    step: turn
    message: "Что я просил тебя сделать в предыдущем сообщении? Ответь кратко."
    sessionId: "{session_id}"
    assert:
      - { var: turn.text, contains: "слов" }
