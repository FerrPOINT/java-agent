# Cron advanced: run now, executions, delivered, suggestions/clear, heartbeat/nack
name: cron-advanced
steps:
  - name: create a cron job for advanced ops
    method: POST
    path: /agent/cron
    body:
      name: "e2e-cron-advanced"
      schedule: "0 0 1 1 *"
      prompt: "test prompt"
    assert:
      - { status: 200 }
      - { path: name, eq: "e2e-cron-advanced" }
      - { path: enabled, eq: true }
      - { path: lastRunAt, eq: null }
    extract:
      id: cron_id

  - name: run cron job now
    method: POST
    path: /agent/cron/{cron_id}/run
    body: {}
    assert:
      - { status: 200 }
      - { path: lastStatus, eq: success }
      - { path: lastRunAt, exists: true }
      - { path: lastRunSessionId, exists: true }

  - name: list successful execution for cron job
    path: /agent/cron/{cron_id}/executions
    assert:
      - { status: 200 }
      - { path: "[0].jobId", eq: "{cron_id}" }
      - { path: "[0].status", eq: success }
      - { path: "[0].finishedAt", exists: true }

  - name: mark delivered
    method: POST
    path: /agent/cron/{cron_id}/delivered
    body: {}
    assert:
      - { status: 200 }
      - { path: lastStatus, eq: success }
      - { path: lastDeliveredRunAt, exists: true }
      - { path: lastDeliveredRunAt, ne: null }

  - name: clear accepted suggestions
    method: POST
    path: /agent/cron/suggestions/clear
    body: {}
    assert:
      - { status: 200 }
      - { path: cleared, exists: true }

  - name: heartbeat result nack on nonexistent session
    method: POST
    path: /agent/cron/heartbeat/00000000-0000-0000-0000-0000000000ee/result/nack
    body: {}
    assert:
      - { status: 200 }
      - { path: drop, exists: true }

  - name: cleanup delete cron job
    method: DELETE
    path: /agent/cron/{cron_id}
    assert: { status: 200 }

  - name: deleted cron job is absent from list
    path: /agent/cron
    assert:
      - { status: 200 }
      - { path: "[*].id", not_contains: "{cron_id}" }