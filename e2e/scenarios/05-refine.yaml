# /refine: valid-session acceptance, focus contract, unknown/empty-session rejection, repeat dispatch
name: refine
steps:
  - name: unknown session is rejected with reason
    method: POST
    path: /agent/refine
    body: { sessionId: "00000000-0000-0000-0000-0000000000ff" }
    assert:
      - { status: 200 }
      - { accepted: false }
      - { path: reason, contains: "session not found" }

  - name: create a session with persisted conversation
    step: turn
    message: "Запомни только для этого диалога: E2E_REFINE_FACT. Подтверди одним словом."
    assert:
      - { var: turn.error, eq: null }
      - { var: turn.text, len_gte: 1 }

  - name: history confirms session is non-empty
    path: /agent/session/{session_id}/history
    assert:
      - { status: 200 }
      - { path: "[0].content", contains: "E2E_REFINE_FACT" }

  - name: refine without focus is accepted and returns session
    method: POST
    path: /agent/refine
    body: { sessionId: "{session_id}" }
    assert:
      - { status: 200 }
      - { accepted: true }
      - { path: sessionId, eq: "{session_id}" }
      - { path: message, contains: "Reviewing this conversation" }

  - name: refine with focus is accepted and echoes focus
    method: POST
    path: /agent/refine
    body:
      sessionId: "{session_id}"
      focus: "communication preferences"
    assert:
      - { status: 200 }
      - { accepted: true }
      - { path: sessionId, eq: "{session_id}" }
      - { path: message, contains: "focus: communication preferences" }

  - name: repeat focused refine is accepted
    method: POST
    path: /agent/refine
    body:
      sessionId: "{session_id}"
      focus: "communication preferences"
    assert:
      - { status: 200 }
      - { accepted: true }

  - name: background review never deletes original session
    path: /agent/session/{session_id}/history
    assert:
      - { status: 200 }
      - { path: "[0].content", contains: "E2E_REFINE_FACT" }