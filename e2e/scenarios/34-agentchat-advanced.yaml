# AgentChat advanced: exact-request approvals, transcribe, debug-report, reasoning-levels
name: agentchat-advanced
steps:
  - name: unknown approval request
    method: POST
    path: /agent/approvals/00000000-0000-0000-0000-0000000000aa/approve
    body: ""
    assert:
      - { status: 404 }

  - name: unknown denial request
    method: POST
    path: /agent/approvals/00000000-0000-0000-0000-0000000000bb/deny
    body: ""
    assert:
      - { status: 404 }

  - name: reasoning levels list
    path: /agent/reasoning-levels
    assert:
      - { status: 200 }
      - { path: "[0]", exists: true }
