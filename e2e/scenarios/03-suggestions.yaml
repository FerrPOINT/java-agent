# Suggestions catalog: seed idempotency, dismiss/accept lifecycle, negative cases, cleanup
name: suggestions-catalog
continue_on_error: true
steps:
  - name: clear accepted suggestions to reset state
    method: POST
    path: /agent/cron/suggestions/clear
    assert: { status: 200 }

  - name: seed catalog — idempotent, may add 0+
    method: POST
    path: /agent/cron/suggestions/catalog
    assert:
      - { status: 200 }
      - { path: added, gte: 0 }

  - name: pending list is array
    path: /agent/cron/suggestions
    assert: { status: 200 }

  - name: re-seed is idempotent — added stays same or 0
    method: POST
    path: /agent/cron/suggestions/catalog
    assert:
      - { status: 200 }
      - { path: added, eq: 0 }

  - name: accept unknown id rejected
    method: POST
    path: /agent/cron/suggestions/no-such-id/accept
    assert:
      - { status: 200 }
      - { accepted: false }

  - name: dismiss unknown id rejected
    method: POST
    path: /agent/cron/suggestions/no-such-id/dismiss
    assert:
      - { status: 200 }
      - { dismissed: false }

  - name: accept malformed UUID returns false
    method: POST
    path: /agent/cron/suggestions/not-a-uuid/accept
    assert:
      - { status: 200 }
      - { accepted: false }

  - name: dismiss malformed UUID returns false
    method: POST
    path: /agent/cron/suggestions/not-a-uuid/dismiss
    assert:
      - { status: 200 }
      - { dismissed: false }