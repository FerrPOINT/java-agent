# Production docker-compose — standard ports
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: project_workflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:-project_workflow}
      POSTGRES_DB: java_agent
    volumes:
      - java_agent_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_workflow -d java_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: java_agent
      DB_USER: project_workflow
      DB_PASSWORD: ${DB_PASSWORD:-project_workflow}
      AGENT_SECURITY_API_KEY: ${AGENT_SECURITY_API_KEY:?AGENT_SECURITY_API_KEY is required when SPRING_PROFILES_ACTIVE=prod}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      AGENT_SERVER_PORT: 8080
      AGENT_MODEL_PROVIDER: ${AGENT_MODEL_PROVIDER:-openai-compatible}
      AGENT_MODEL_BASE_URL: ${AGENT_MODEL_BASE_URL:-https://ollama.com/v1}
      AGENT_MODEL_NAME: ${AGENT_MODEL_NAME:-kimi-k2.6}
      AGENT_CHROMIUM_AUTO_START: "true"
      AGENT_CHROMIUM_AUTO_INSTALL: "true"
      AGENT_BROWSER_CDP_URL: "http://localhost:9222"
    ports:
      - "8080:8080"
    volumes:
      - agent_chromium:/home/agent/.azhukov-agent
      - ${AGENT_WORK_DIR:-./work}:/workspace
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  java_agent_pg:
  agent_chromium:
