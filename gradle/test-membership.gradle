import groovy.json.JsonSlurper
import org.gradle.work.DisableCachingByDefault

@DisableCachingByDefault(because = 'Source inventory is a local verification prerequisite')
abstract class VerifyTestCompilationInventory extends DefaultTask {
    @Input abstract ListProperty<String> getDeclaredSources()
    @InputFiles @PathSensitive(PathSensitivity.RELATIVE)
    abstract ConfigurableFileCollection getSourceFiles()
    @Internal abstract DirectoryProperty getSourceRoot()

    @TaskAction void verify() {
        def root = sourceRoot.get().asFile.toPath()
        def actual = sourceFiles.files.collect { root.relativize(it.toPath()).toString().replace('\\', '/') } as Set
        if (actual != declaredSources.get().toSet()) {
            throw new GradleException('Classify every test/support source before compilation; remove stale inventory entries')
        }
    }
}

// The reviewed inventory is shared by the standalone backend and root graph.
def laneRoot = new File(projectDir, '..')
if (!new File(laneRoot, 'gradle/test-lanes.json').isFile()) {
    // Standalone Docker backend keeps shared/ and gradle/ inside /workspace.
    laneRoot = projectDir
}
def inventory = new JsonSlurper().parse(new File(laneRoot, 'gradle/test-lanes.json'))
def moduleName = project.name == 'java-agent-backend' ? 'backend' : projectDir.name
def modulePrefix = moduleName + '/src/test/'
def classPatterns = { String path ->
    def className = path.substring(path.indexOf('/src/test/') + '/src/test/'.length())
        .replaceFirst('^(java|groovy)/', '').replaceFirst(/\.(java|groovy)$/, '')
    [className + '.class', className + '$*.class']
}
def unitPatterns = inventory.files.findAll { path, tier ->
    path.startsWith(modulePrefix) && tier == 'unit'
}.keySet().collectMany(classPatterns)
def slowPatterns = inventory.files.findAll { path, tier ->
    path.startsWith(modulePrefix) && tier == 'slow'
}.keySet().collectMany(classPatterns)

// Execution filters alone still compile every test. Keep the reviewed sources
// in their existing paths, with independent unit/manual compilation outputs.
def support = inventory.support ?: [:]
def sourceRoles = [:]
inventory.files.each { path, tier ->
    if (path.startsWith(modulePrefix)) {
        if (!(tier in ['unit', 'integration', 'slow', 'live'])) {
            throw new GradleException("Unknown test tier: ${path}")
        }
        sourceRoles[path.substring(modulePrefix.length())] = tier == 'unit' ? 'unit' : 'manual'
    }
}
support.each { path, role ->
    if (path.startsWith(modulePrefix)) {
        if (!(role in ['unit', 'manual', 'shared']) || inventory.files.containsKey(path)) {
            throw new GradleException("Invalid or overlapping test support: ${path}")
        }
        sourceRoles[path.substring(modulePrefix.length())] = role
    }
}
// Metadata-only dependency preparation has no source files. Validate when
// compilation/testing is requested, without attaching it to dependency views.
def verifySources = tasks.register('verifyTestCompilationInventory', VerifyTestCompilationInventory) {
    declaredSources = sourceRoles.keySet().toList().sort()
    sourceRoot = layout.projectDirectory.dir('src/test')
    sourceFiles.from(fileTree('src/test') { include '**/*.java', '**/*.groovy' })
    group = 'verification'
    description = 'Verify complete test/support source partition without compiling manual lanes'
}
def javaDirs = sourceSets.test.java.srcDirs.toList()
def hasGroovy = plugins.hasPlugin('groovy')
def groovyDirs = hasGroovy ? sourceSets.test.groovy.srcDirs.toList() : []
def configureSources = { sourceSet, String role ->
    def selected = sourceRoles.findAll { path, lane -> lane == role }.keySet()
    def javaFiles = selected.findAll { it.startsWith('java/') }.collect { it.substring('java/'.length()) }
    sourceSet.java.setSrcDirs(javaDirs)
    sourceSet.java.setIncludes(javaFiles ?: ['__no_reviewed_sources__.java'])
    if (hasGroovy) {
        def groovyFiles = selected.findAll { it.startsWith('groovy/') }.collect { it.substring('groovy/'.length()) }
        sourceSet.groovy.setSrcDirs(groovyDirs)
        sourceSet.groovy.setIncludes(groovyFiles ?: ['__no_reviewed_sources__.groovy'])
    }
}
def commonSources = sourceSets.testSupport
def manualSources = sourceSets.manualTest
configureSources(sourceSets.test, 'unit')
configureSources(commonSources, 'shared')
configureSources(manualSources, 'manual')
[sourceSets.test, commonSources, manualSources].each { sourceSet ->
    tasks.named(sourceSet.compileJavaTaskName) { dependsOn verifySources }
    if (hasGroovy) { tasks.named(sourceSet.getCompileTaskName('groovy')) { dependsOn verifySources } }
}

tasks.named('test', Test) {
    dependsOn verifySources
    description = 'Fast isolated unit tests; runs with ordinary build/check/bootJar'
    useJUnitPlatform { excludeTags 'integration', 'slow', 'live', 'e2e' }
    // Never interpret an empty allowlist as "run every test".
    include(unitPatterns ?: ['__no_reviewed_unit_tests__.class'])
}

tasks.named('integrationTest', Test) { exclude(unitPatterns + slowPatterns) }
tasks.named('slowTest', Test) {
    include(slowPatterns ?: ['__no_declared_slow_tests__.class'])
    onlyIf { !slowPatterns.isEmpty() }
}
