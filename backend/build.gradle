plugins {
    id 'java'
    id 'groovy'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.azhukov'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

// MapStruct defaults; Lombok and MapStruct processors are resolved via annotationProcessor configuration.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
        '-Amapstruct.defaultComponentModel=spring',
        '-Amapstruct.unmappedTargetPolicy=ERROR',
        '-Amapstruct.suppressGeneratorTimestamp=true'
    ]
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spring.io/milestone' }
}

dependencies {
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-health'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Groovy 5 (override Spring Boot 4.1 default 5.0.6 for latest patch)
    implementation 'org.apache.groovy:groovy:5.0.7'
    implementation 'org.apache.groovy:groovy-json:5.0.7'

    // LLM (latest stable, not in Spring Boot BOM)
    implementation 'dev.langchain4j:langchain4j:1.18.0'
    implementation 'dev.langchain4j:langchain4j-open-ai:1.18.0'
    implementation 'dev.langchain4j:langchain4j-ollama:1.18.0'

    // MCP (GA 2.0, not in Spring Boot BOM)
    implementation 'io.modelcontextprotocol.sdk:mcp:2.0.0'

    // DB / migrations — versions managed by Spring Boot 4.1 BOM
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Templating (Pebble 4.x supports Spring Boot 3+, Java 17+)
    implementation 'io.pebbletemplates:pebble:4.1.2'

    implementation 'io.github.resilience4j:resilience4j-retry:2.4.0'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.4.0'
    implementation 'io.github.resilience4j:resilience4j-timelimiter:2.4.0'
    implementation 'io.github.resilience4j:resilience4j-spring6:2.4.0'

    // Spring Retry for @Retryable annotations
    implementation 'org.springframework.retry:spring-retry:2.0.11'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    testCompileOnly 'org.projectlombok:lombok:1.18.38'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'

    // MapStruct
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    testCompileOnly 'org.mapstruct:mapstruct:1.6.3'
    testAnnotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

    // OpenAPI / Swagger UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'

    // WebSocket client for CDP
    implementation 'org.java-websocket:Java-WebSocket:1.6.0'

    // HTML / markdown parsing
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'com.vladsch.flexmark:flexmark:0.64.8'
    implementation 'com.vladsch.flexmark:flexmark-html2md-converter:0.64.8'
    implementation 'org.tomlj:tomlj:1.1.1'
    implementation 'org.apache.pdfbox:pdfbox:3.0.8'

    // Commons utilities
    implementation 'org.apache.commons:commons-lang3:3.17.0'
    implementation 'commons-io:commons-io:2.18.0'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'com.cronutils:cron-utils:9.2.1'
    implementation 'com.bucket4j:bucket4j-core:8.10.1'

    // Image metadata (vision safety / thumbnailing)
    implementation 'org.apache.commons:commons-imaging:1.0.0-alpha5'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'

    // Test / local in-memory DB
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.apache.groovy:groovy-test:5.0.7'
    runtimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Testcontainers for real PostgreSQL integration tests
    testImplementation 'org.testcontainers:testcontainers:1.21.4'
    testImplementation 'org.testcontainers:postgresql:1.21.4'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.4'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'live', 'slow', 'e2e'
    }
    jvmArgs '-XX:+EnableDynamicAgentLoading'
    maxHeapSize = '4g'
    maxParallelForks = 1
    forkEvery = 750
    // Workaround for Gradle 9.x EOFException in test result serialization
    reports {
        junitXml.required = true
        html.required = false
    }
    finalizedBy jacocoTestReport
}


tasks.register('slowTest', Test) {
    description = 'Runs slow integration tests'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'slow'
        excludeTags 'live'
    }
    jvmArgs '-XX:+EnableDynamicAgentLoading'
    maxHeapSize = '4g'
}

tasks.register('liveTest', Test) {
    description = 'Runs live integration tests requiring external services'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'live'
    }
    jvmArgs '-XX:+EnableDynamicAgentLoading'
    maxHeapSize = '4g'
    finalizedBy jacocoTestReport
}

tasks.register('e2eTest', Test) {
    description = 'Runs E2E tests against a running java-agent instance (docker compose up first)'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'e2e'
    }
    jvmArgs '-XX:+EnableDynamicAgentLoading'
    maxHeapSize = '2g'
    systemProperty 'e2e.baseUrl', System.getProperty('e2e.baseUrl', 'http://localhost:18090')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}

tasks.named('jacocoTestReport') {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
}

springBoot {
    buildInfo()
}

def ferrpointNoticeFiles = [
    rootProject.file('LICENSE'),
    rootProject.file('NOTICE'),
    rootProject.file('THIRD_PARTY_NOTICES.md')
]

tasks.withType(Jar).configureEach {
    ferrpointNoticeFiles.each { noticeFile ->
        from(noticeFile) {
            into 'META-INF'
        }
    }
    manifest {
        attributes(
            'Implementation-Vendor': 'FerrPOINT',
            'Implementation-Vendor-Id': 'FerrPOINT',
            'License': 'LicenseRef-FerrPOINT-Proprietary',
            'License-Name': 'FerrPOINT Proprietary Source-Available Evaluation License v1.0',
            'License-File': 'META-INF/LICENSE'
        )
    }
}

// Allow JLine native terminal access without warning on Java 25.
// maxHeapSize prevents OOM/SIGKILL when real LLM calls buffer large payloads
// inside the Gradle daemon JVM (daemon overhead + app heap > available RAM).
// For production-like runs with real LLM load prefer `java -jar` (no daemon overhead).
tasks.named('bootRun') {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    maxHeapSize = '2g'
}
tasks.named('bootJar') {
    manifest {
        attributes 'Start-Class': 'com.azhukov.agent.JavaAgentApplication'
    }
}

// For plain java -jar runs, add this option via environment or wrapper script.
// Example: JAVA_TOOL_OPTIONS='--enable-native-access=ALL-UNNAMED' java -jar ...
