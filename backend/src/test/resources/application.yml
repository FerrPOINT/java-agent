spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

agent:
  name: Test Agent
  model:
    provider: noop
  memory:
    enabled: false
  skills:
    enabled: false
  mcp:
    enabled: false
    servers: []
  chromium:
    auto-start: false
    auto-install: false
  gateway:
    telegram:
      long-polling:
        enabled: false
