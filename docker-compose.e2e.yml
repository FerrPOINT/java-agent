services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: project_workflow
      POSTGRES_PASSWORD: project_workflow
      POSTGRES_DB: java_agent
    volumes:
      - java_agent_e2e_pg:/var/lib/postgresql/data
    networks:
      - e2e
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_workflow -d java_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  agent:
    init: true
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: java_agent
      DB_USER: project_workflow
      DB_PASSWORD: project_workflow
      AGENT_SERVER_PORT: "18090"
      HERMES_HOME: /home/agent/.java-agent
      AGENT_ATTACHMENTS_CACHE_ROOT: /home/agent/.java-agent/attachments
      AGENT_CORE_WORKING_DIRECTORY: /workspace
      # The compose smoke deliberately uses prod hardening; this is a synthetic
      # non-secret key solely for its isolated disposable stack.
      AGENT_SECURITY_API_KEY: "e2e-only-api-key-not-a-secret"
      AGENT_MODEL_PROVIDER: noop
      AGENT_CHROMIUM_AUTO_START: "false"
      AGENT_CHROMIUM_AUTO_INSTALL: "false"
      AGENT_GATEWAY_TELEGRAM_LONG_POLLING_ENABLED: "false"
      AGENT_GATEWAY_TELEGRAM_WEBHOOK_ENABLED: "false"
      # Enable memory and skills so the e2e tests can exercise those endpoints
      AGENT_MEMORY_ENABLED: "true"
      AGENT_SKILLS_ENABLED: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "2", "--output", "/dev/null", "http://localhost:18090/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - java_agent_e2e_state:/home/agent/.java-agent
      - java_agent_e2e_workspace:/workspace
    networks:
      - e2e
    ports:
      - "18090:18090"

networks:
  e2e:
    driver: bridge

volumes:
  java_agent_e2e_pg:
  java_agent_e2e_state:
  java_agent_e2e_workspace:
