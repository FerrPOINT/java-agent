name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs standard ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Docs & test-standard ratchet (baseline in docs/standards/coverage-baseline.json)
        run: python3 scripts/check_docs_standard.py
      - name: Verify shipped-default documentation coverage
        run: python3 scripts/check_default_settings_reference.py
      - name: Documentation and release-script unit tests
        run: python3 -m unittest scripts.tests.test_check_docs_standard scripts.tests.test_check_default_settings_reference scripts.tests.test_release_verify scripts.tests.test_deploy_dev_systemd scripts.tests.test_deploy_dev_docker scripts.tests.test_parity_dashboard

  readme:
    name: README evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: README validator tests
        run: python3 -m unittest scripts.tests.test_verify_readme
      - name: README structural validation
        run: python3 scripts/verify_readme.py

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25.0.4+101.0.LTS'
      - name: Verify exact Temurin runtime
        run: java -XshowSettings:properties -version 2>&1 | grep -F 'java.runtime.version = 25.0.4.1+1-LTS'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/gradle-wrapper.properties', 'backend/**/*.gradle', 'backend/**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew backend/gradlew

      - name: Backend unit tests and the same candidate JAR
        working-directory: backend
        run: ./gradlew test bootJar --no-daemon --max-workers=2

      - name: Run telegram-bot and cli tests
        run: ./gradlew :telegram-bot:test :cli:test :shared:test --no-daemon --max-workers=2
      - name: Seal the tested backend candidate
        run: sha256sum backend/build/libs/*.jar > backend/build/libs/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: tested-backend-candidate
          path: backend/build/libs/
          retention-days: 7


  lint:
    name: Markdown / YAML lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify bot/backend auth Compose wiring
        run: |
          python3 -m unittest scripts.tests.test_check_compose_backend_auth
          python3 scripts/check-compose-backend-auth.py
      - uses: articulate/actions-markdownlint@v1
        with:
          config: .markdownlint.json
          files: 'docs/**/*.md, *.md'
        continue-on-error: false
