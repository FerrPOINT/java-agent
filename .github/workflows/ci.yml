name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readme:
    name: README evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: README validator tests
        run: python3 -m unittest scripts.tests.test_verify_readme
      - name: README structural validation
        run: python3 scripts/verify_readme.py

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/gradle-wrapper.properties', 'backend/**/*.gradle', 'backend/**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew backend/gradlew

      - name: Run backend tests
        working-directory: backend
        run: ./gradlew test --no-daemon

      - name: Run telegram-bot and cli tests
        run: ./gradlew :telegram-bot:test :cli:test --no-daemon

  build:
    name: Build bootJar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Build bootJar
        working-directory: backend
        run: ./gradlew bootJar --no-daemon -x test

  lint:
    name: Markdown / YAML lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify bot/backend auth Compose wiring
        run: python3 scripts/check-compose-backend-auth.py
      - uses: articulate/actions-markdownlint@v1
        with:
          config: .markdownlint.json
          files: 'docs/**/*.md, *.md'
        continue-on-error: false
