name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['25']
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/gradle-wrapper.properties', 'backend/**/*.gradle', 'backend/**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x backend/gradlew

      - name: Run tests
        working-directory: backend
        run: ./gradlew test --no-daemon

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: backend/build/reports/tests/test/

  build-image:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Build bootJar
        working-directory: backend
        run: ./gradlew bootJar --no-daemon -x test

      - name: Build Docker image
        run: docker build -f Dockerfile -t java-agent:latest .

      - name: Build slim Docker image
        run: docker build -f Dockerfile.slim -t java-agent:slim .

      - name: Smoke test slim image
        run: |
          docker run -d --name agent-smoke -p 8092:8080 \
            -e SPRING_PROFILES_ACTIVE=noop \
            -e AGENT_CHROMIUM_AUTO_START=false \
            -e AGENT_BROWSER_CDP_URL=http://localhost:9222 \
            -e AGENT_MEMORY_ENABLED=false \
            -e AGENT_SKILLS_ENABLED=false \
            java-agent:slim
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8092/actuator/health/liveness && break
            sleep 2
          done
          docker stop agent-smoke
          docker rm agent-smoke

  lint:
    name: Markdown / YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: articulate/actions-markdownlint@v1
        with:
          config: .markdownlint.json
          files: 'docs/**/*.md, *.md'
        continue-on-error: true
