name: Release checks (manual)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs standard ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Docs & test-standard ratchet (baseline in docs/standards/coverage-baseline.json)
        run: python3 scripts/check_docs_standard.py
      - name: Verify shipped-default documentation coverage
        run: python3 scripts/check_default_settings_reference.py
      - name: Documentation and release-script unit tests
        run: python3 -m unittest scripts.tests.test_check_docs_standard scripts.tests.test_check_default_settings_reference scripts.tests.test_release_verify scripts.tests.test_deploy_dev_systemd scripts.tests.test_parity_dashboard

  readme:
    name: README evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: README validator tests
        run: python3 -m unittest scripts.tests.test_verify_readme
      - name: README structural validation
        run: python3 scripts/verify_readme.py

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: usage_regression
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: owned-qa-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa -d usage_regression"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25.0.4+101.0.LTS'
      - name: Verify exact Temurin runtime
        run: java -XshowSettings:properties -version 2>&1 | grep -F 'java.runtime.version = 25.0.4.1+1-LTS'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/gradle-wrapper.properties', 'backend/**/*.gradle', 'backend/**/gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew backend/gradlew

      - name: Run backend tests
        working-directory: backend
        run: bash ../scripts/quality-gradle.sh --backend :jacocoTestReport :bootJar --no-daemon --max-workers=2
        env:
          USAGE_PERSISTENCE_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/usage_regression
          USAGE_PERSISTENCE_TEST_DB_USER: qa
          USAGE_PERSISTENCE_TEST_DB_PASSWORD: owned-qa-only

      - name: Coverage report (visibility, non-blocking)
        working-directory: backend
        run: |
          # The XML is a JaCoCo-generated local artifact, not untrusted input; stdlib parse is safe here.
          python3 - <<'EOF'
          import os, xml.etree.ElementTree as ET
          root = ET.parse('build/reports/jacoco/test/jacocoTestReport.xml').getroot()
          line = next(x for x in root.findall('counter') if x.get('type') == 'LINE')
          c, m = int(line.get('covered')), int(line.get('missed'))
          pct = 100 * c / (c + m)
          print(f'backend LINE coverage: {pct:.2f}% (gate: 80.00%)')
          with open(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'), 'a') as summary:
              summary.write(f'## Backend LINE coverage: {pct:.2f}% (gate 80.00%, deficit {int((c+m)*0.80)-c} lines)\n')
          EOF

      - name: Record tested backend JAR identity
        run: sha256sum backend/build/libs/java-agent-backend-0.0.1-SNAPSHOT.jar > backend/build/libs/java-agent-backend-0.0.1-SNAPSHOT.jar.sha256
      - name: Preserve tested backend JAR
        uses: actions/upload-artifact@v7
        with:
          name: java-backend-tested-jar
          path: |
            backend/build/libs/java-agent-backend-0.0.1-SNAPSHOT.jar
            backend/build/libs/java-agent-backend-0.0.1-SNAPSHOT.jar.sha256
          if-no-files-found: error

      - name: Run telegram-bot and cli tests
        run: bash scripts/quality-gradle.sh :telegram-bot:jacocoTestReport :cli:test :cli:integrationTest :cli:slowTest :shared:test :shared:integrationTest :shared:slowTest --no-daemon --max-workers=2

      - name: Coverage ratchet (blocking, baseline in docs/standards/coverage-baseline.json)
        run: |
          python3 scripts/check_docs_standard.py --check-coverage

  build:
    name: Build bootJar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Consume the same tested bootJar
        uses: actions/download-artifact@v7
        with:
          name: java-backend-tested-jar
          path: backend/build/libs
      - name: Verify required artifact exists
        run: |
          test -s backend/build/libs/java-agent-backend-0.0.1-SNAPSHOT.jar
          sha256sum -c backend/build/libs/java-agent-backend-0.0.1-SNAPSHOT.jar.sha256

  lint:
    name: Markdown / YAML lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify bot/backend auth Compose wiring
        run: python3 scripts/check-compose-backend-auth.py
      - uses: articulate/actions-markdownlint@v1
        with:
          config: .markdownlint.json
          files: 'docs/**/*.md, *.md'
        continue-on-error: false
