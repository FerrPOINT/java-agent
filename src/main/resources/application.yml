spring:
  application:
    name: hermes-java-agent

  datasource:
    url: jdbc:sqlite:${user.home}/.hermes/java-agent/db/hermes.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
    show-sql: false

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

hermes:
  model:
    provider: openai
    base-url: https://api.openai.com/v1
    api-key: ${HERMES_MODEL_API_KEY:}
    model-name: gpt-4o-mini
    timeout-seconds: 60
    max-retries: 3
  vision:
    base-url: ${HERMES_VISION_BASE_URL:https://api.openai.com/v1}
    api-key: ${HERMES_VISION_API_KEY:}
    model-name: gpt-4o
  browser:
    cdp-url: ${HERMES_BROWSER_CDP_URL:http://localhost:9222}
    default-timeout-ms: 30000
  agent:
    default-system-prompt: |
      You are Hermes Java Agent. Use available tools when needed.
      Be concise. Return plain text unless JSON is requested.

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.ferrpoint.hermes: INFO
