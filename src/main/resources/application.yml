spring:
  application:
    name: java-agent

  datasource:
    url: jdbc:sqlite:${user.home}/.java-agent/db/agent.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
    show-sql: false

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

  threads:
    virtual:
      enabled: true

agent:
  name: ${AGENT_NAME:Джава агент}
  model:
    provider: openai
    base-url: https://api.openai.com/v1
    api-key: ${AGENT_MODEL_API_KEY:}
    model-name: gpt-4o-mini
    timeout-seconds: 60
    max-retries: 3
  vision:
    base-url: ${AGENT_VISION_BASE_URL:https://api.openai.com/v1}
    api-key: ${AGENT_VISION_API_KEY:}
    model-name: gpt-4o
  browser:
    cdp-url: ${AGENT_BROWSER_CDP_URL:http://localhost:9222}
    default-timeout-ms: 30000
  core:
    default-system-prompt: |
      You are ${agent.name}. Use available tools when needed.
      Be concise. Return plain text unless JSON is requested.

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.azhukov.agent: INFO
