spring:
  application:
    name: java-agent

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:java_agent}
    username: ${DB_USER:project_workflow}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

  threads:
    virtual:
      enabled: true

agent:
  name: ${AGENT_NAME:Джава агент}
  model:
    provider: ollama
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    api-key: ${OLLAMA_API_KEY:}
    model-name: ${OLLAMA_MODEL:qwen2.5:3b}
    timeout-seconds: 60
    max-retries: 3
  vision:
    base-url: ${AGENT_VISION_BASE_URL:http://localhost:11434}
    api-key: ${AGENT_VISION_API_KEY:}
    model-name: ${OLLAMA_VISION_MODEL:}
  browser:
    cdp-url: ${AGENT_BROWSER_CDP_URL:http://localhost:9222}
    default-timeout-ms: 30000
  core:
    default-system-prompt: |
      You are ${agent.name}. Use available tools when needed.
      Be concise. Return plain text unless JSON is requested.

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.azhukov.agent: INFO
