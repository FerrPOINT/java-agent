# Local runtime: one Compose project owns every running Java Agent service.
# All host ports use the 11xx range and bind only to loopback:
#   backend 1180, PostgreSQL 1181, Telegram bot 1182, and SearXNG 1183.
# The CLI is included as an interactive client without a host listener.
# Usage: docker compose -f docker-compose.local.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: project_workflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:-project_workflow}
      POSTGRES_DB: java_agent
    volumes:
      - java_agent_local_pg:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:1181:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_workflow -d java_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  searxng:
    image: searxng/searxng:latest
    init: true
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    ports:
      - "127.0.0.1:1183:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://localhost:8080/search?q=health&format=json' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      searxng:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: java_agent
      DB_USER: project_workflow
      DB_PASSWORD: ${DB_PASSWORD:-project_workflow}
      AGENT_SERVER_PORT: 1180
      AGENT_MODEL_PROVIDER: ${AGENT_MODEL_PROVIDER:-openai-compatible}
      AGENT_MODEL_BASE_URL: ${AGENT_MODEL_BASE_URL:-https://ollama.com/v1}
      AGENT_MODEL_API_KEY: ${AGENT_MODEL_API_KEY:-}
      AGENT_SECURITY_API_KEY: ${AGENT_SECURITY_API_KEY:-}
      AGENT_MODEL_NAME: ${AGENT_MODEL_NAME:-kimi-k2.6}
      AGENT_WEB_SEARXNG_URL: http://searxng:8080
      AGENT_CHROMIUM_AUTO_START: "true"
      AGENT_CHROMIUM_AUTO_INSTALL: "true"
      AGENT_BROWSER_CDP_URL: "http://localhost:9222"
      AGENT_GATEWAY_TELEGRAM_LONG_POLLING_ENABLED: "false"
      AGENT_GATEWAY_TELEGRAM_WEBHOOK_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      AGENT_GATEWAY_TELEGRAM_ALLOWED_USER_IDS: ${AGENT_GATEWAY_TELEGRAM_ALLOWED_USER_IDS:-}
      AGENT_GATEWAY_TELEGRAM_ALLOWED_USERNAMES: ${AGENT_GATEWAY_TELEGRAM_ALLOWED_USERNAMES:-}
      AGENT_GATEWAY_TELEGRAM_ALLOW_BY_DEFAULT: ${AGENT_GATEWAY_TELEGRAM_ALLOW_BY_DEFAULT:-true}
    ports:
      - "127.0.0.1:1180:1180"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:1180/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s
    volumes:
      - agent_local_chromium:/home/agent/.azhukov-agent
      - ${AGENT_WORK_DIR:-./work}:/workspace

  telegram-bot:
    build:
      context: .
      dockerfile: telegram-bot/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      agent:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: java_agent
      DB_USER: project_workflow
      DB_PASSWORD: ${DB_PASSWORD:-project_workflow}
      BOT_SERVER_PORT: 1182
      BOT_MODE: polling
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      BOT_BACKEND_URL: http://agent:1180
      BOT_BACKEND_API_KEY: ${AGENT_SECURITY_API_KEY:-}
      BOT_AGENT_NAME: ${BOT_AGENT_NAME:-Джава агент}
      BOT_ALLOWED_USER_IDS: ${BOT_ALLOWED_USER_IDS:-}
      BOT_ALLOWED_USERNAMES: ${BOT_ALLOWED_USERNAMES:-}
      BOT_ALLOW_BY_DEFAULT: ${BOT_ALLOW_BY_DEFAULT:-true}
    ports:
      - "127.0.0.1:1182:1182"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:1182/bot/health | grep -q '\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  cli:
    build:
      context: .
      dockerfile: cli/Dockerfile
    depends_on:
      agent:
        condition: service_healthy
    environment:
      CLI_BACKEND_URL: http://agent:1180
      CLI_API_KEY: ${AGENT_SECURITY_API_KEY:-}
    profiles: ["cli"]
    stdin_open: true
    tty: true

volumes:
  java_agent_local_pg:
  agent_local_chromium:
